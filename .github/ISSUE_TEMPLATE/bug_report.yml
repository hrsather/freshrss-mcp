name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the tool call and the error string. Do not paste your API password, bearer token, or private feed contents.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `freshrss-mcp --version` or the image tag
    validations:
      required: true
  - type: input
    id: freshrss
    attributes:
      label: FreshRSS version
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options: [stdio, sse]
    validations:
      required: true
