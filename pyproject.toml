[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freshrss-mcp"
version = "0.1.0"
description = "MCP server for FreshRSS over the Google Reader API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Hayden Sather" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "mcp>=2.3",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.scripts]
freshrss-mcp = "freshrss_mcp.cli:main"

[project.urls]
Repository = "https://github.com/hrsather/freshrss-mcp"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/freshrss_mcp"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs a real FreshRSS (set FRESHRSS_TEST_URL)"]
addopts = "--cov=freshrss_mcp --cov-fail-under=90"
